<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:'PoppinsX';src:url('../fonts/Poppins-Regular.ttf');font-weight:400}
@font-face{font-family:'PoppinsX';src:url('../fonts/Poppins-Medium.ttf');font-weight:500}
@font-face{font-family:'PoppinsX';src:url('../fonts/Poppins-Bold.ttf');font-weight:700 900}
:root{--hi:#2f55e0;--acc:#2f55e0;--acc2:#22d3ee;--lightbg:#f3f6fc;--darkbg:#060a1a;--t1:#22d3ee;--al:#ff4d5e;--vi:#a78bfa;--cta1:#0fb894;--cta2:#0a8f8f;--plate:#fbbf24;--ink:#0f172a;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:'PoppinsX','Poppins','Noto Sans',sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.scene{position:absolute;inset:0;opacity:0}
.light{background:var(--lightbg);color:var(--ink);--sub:#64748b}
.dark{background:var(--darkbg);color:#fff;--sub:#94a3c4;--kl:color-mix(in srgb,var(--k) 55%,#fff)}
.scene::before,.scene::after{content:"";position:absolute;inset:0;pointer-events:none}
.scene::before{background-position:var(--bgp,0 0)}
.light::after{background:radial-gradient(ellipse 70% 40% at 50% 52%,color-mix(in srgb,var(--acc) 17%,transparent),transparent 70%)}
.dark::after{background:radial-gradient(ellipse 75% 38% at 50% 52%,color-mix(in srgb,var(--k) 26%,transparent),transparent 70%)}
/* background styles */
.bg-grid .light::before{background-image:linear-gradient(color-mix(in srgb,var(--acc) 8%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--acc) 8%,transparent) 1px,transparent 1px);background-size:54px 54px}
.bg-grid .dark::before{background-image:linear-gradient(color-mix(in srgb,var(--k) 9%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--k) 9%,transparent) 1px,transparent 1px);background-size:54px 54px}
.bg-dots .light::before{background-image:radial-gradient(color-mix(in srgb,var(--acc) 22%,transparent) 2.6px,transparent 3.2px);background-size:46px 46px}
.bg-dots .dark::before{background-image:radial-gradient(color-mix(in srgb,var(--k) 28%,transparent) 2.6px,transparent 3.2px);background-size:46px 46px}
.bg-diag .light::before{background-image:repeating-linear-gradient(135deg,transparent 0 34px,color-mix(in srgb,var(--acc) 7%,transparent) 34px 37px)}
.bg-diag .dark::before{background-image:repeating-linear-gradient(135deg,transparent 0 34px,color-mix(in srgb,var(--k) 9%,transparent) 34px 37px)}
.bg-stripes .light::before{background-image:repeating-linear-gradient(90deg,transparent 0 135px,color-mix(in srgb,var(--acc) 5%,transparent) 135px 270px)}
.bg-stripes .dark::before{background-image:repeating-linear-gradient(90deg,transparent 0 135px,color-mix(in srgb,var(--k) 7%,transparent) 135px 270px)}
.bg-plain .scene::before{display:none}
.row{position:absolute;left:0;right:0;display:flex;justify-content:center;z-index:3}
.row.left{justify-content:flex-start;padding-left:54px}
.c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;padding-top:120px;padding-bottom:260px}
.col{display:flex;flex-direction:column;align-items:center}
.abs{position:absolute;z-index:3}
.i{display:inline-flex;align-items:center;justify-content:center}
.i svg{width:100%;height:100%;display:block}
.kick{font-weight:700;font-size:25px;letter-spacing:.14em;padding:14px 28px;border-radius:99px;white-space:nowrap;display:flex;gap:14px;align-items:center}
.light .kick{background:#fff;color:color-mix(in srgb,var(--k) 62%,#0b1020);box-shadow:0 6px 24px color-mix(in srgb,var(--k) 18%,transparent)}
.dark .kick{background:color-mix(in srgb,var(--k) 10%,transparent);border:1.5px solid color-mix(in srgb,var(--k) 55%,transparent);color:var(--kl);box-shadow:0 0 30px color-mix(in srgb,var(--k) 28%,transparent)}
.kick.tag{border-radius:12px}.kick.tag b{opacity:.55;font-weight:700}
.panel{border-radius:40px}
.light .panel{background:#fff;box-shadow:0 30px 70px color-mix(in srgb,var(--acc) 22%,transparent),0 0 0 1.5px color-mix(in srgb,var(--acc) 10%,transparent)}
.dark .panel{background:color-mix(in srgb,var(--darkbg) 72%,#262e63);border:1.5px solid color-mix(in srgb,var(--k) 38%,transparent);box-shadow:0 0 70px color-mix(in srgb,var(--k) 26%,transparent)}
.ghost{position:absolute;left:0;right:0;top:760px;text-align:center;font-weight:900;z-index:1;line-height:1;white-space:nowrap}
.light .ghost{color:color-mix(in srgb,var(--acc) 8%,transparent)}.dark .ghost{color:rgba(255,255,255,.05)}
/* brand overlay */
#brand{position:absolute;left:54px;top:64px;z-index:30;display:flex;align-items:center;gap:14px;font-weight:700;font-size:28px;letter-spacing:.1em;color:#0f172a}
#brand .tile{width:68px;height:68px;border-radius:50%;overflow:hidden;background:#000;box-shadow:0 6px 18px rgba(0,0,0,.35)}#brand .tile img{width:100%;height:100%;display:block}
#plogo{position:absolute;right:54px;top:44px;z-index:30;width:84px;height:84px;border-radius:24px;background:#fff;padding:14px;box-shadow:0 8px 22px rgba(0,0,0,.28);display:none}#plogo img{width:100%;height:100%;object-fit:contain;display:block}
.plg{width:150px;height:150px;border-radius:36px;background:#fff;padding:26px;box-shadow:0 14px 34px rgba(0,0,0,.28)}.plg img{width:100%;height:100%;object-fit:contain;display:block}
.cmt{font-size:26px;font-weight:700;letter-spacing:.08em;padding:12px 26px;border-radius:99px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.55);color:#fff}
#src{position:absolute;right:54px;top:142px;z-index:30;font-size:20px;font-weight:500;letter-spacing:.08em;color:#64748b}
.ondark #brand{color:#fff}.ondark #src{color:#8b9bc7}
/* hook */
.hl{position:absolute;left:60px;right:60px;top:290px;text-align:center;font-weight:900;line-height:1.1;z-index:3;letter-spacing:-.01em}
.hl .w{display:inline-block;margin:0 .14em}.hl .w.hi{color:var(--hi)}.dark .hl .w.hi{color:var(--kl)}
.card1{position:relative;width:880px;padding:28px;border-radius:44px}
.screen{height:540px;border-radius:28px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 38%,#05071a),#070a1f 60%,color-mix(in srgb,var(--acc2) 26%,#0b0d2c));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden}
.screen .w2{font-weight:900;letter-spacing:.12em;margin-left:.12em;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 40%,#fff),#fff,var(--acc2));-webkit-background-clip:text;color:transparent;line-height:1.1;text-align:center;padding:0 24px}
.screen .by{font-size:22px;letter-spacing:.14em;color:#b4bde6;font-weight:500;text-align:center;padding:0 28px}
.screen .ico{width:84px;height:84px;color:#dbe4ff}
.shine{position:absolute;top:0;bottom:0;width:130px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);transform:skewX(-20deg)}
.bar{height:12px;border-radius:9px;background:color-mix(in srgb,var(--acc) 14%,#e8ecf8);overflow:hidden;margin-top:26px}
.bar i{display:block;height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px}
.pills{display:flex;gap:12px;margin-top:24px;justify-content:center;flex-wrap:wrap}
.pill{font-size:27px;font-weight:700;padding:12px 24px;border-radius:99px;background:color-mix(in srgb,var(--acc) 11%,#fff);color:var(--acc)}
.dark .pill{background:color-mix(in srgb,var(--k) 18%,transparent);color:var(--kl)}
.badge{position:absolute;top:-26px;left:-24px;z-index:5;font-size:22px;font-weight:700;letter-spacing:.08em;padding:12px 22px;border-radius:99px;color:#fff;background:#10b981;box-shadow:0 10px 26px rgba(16,185,129,.45)}
/* slam hook */
.slamw{display:inline-block;font-weight:900;line-height:.98;letter-spacing:-.03em;text-align:center;white-space:nowrap}
.slamw.hi{color:var(--hi)}.dark .slamw.hi{color:var(--kl)}
.slamsub{font-size:44px;font-weight:700;margin-top:34px;text-align:center;line-height:1.2;max-width:900px}
.chipbadge{display:inline-block;font-size:26px;font-weight:700;letter-spacing:.1em;padding:14px 28px;border-radius:99px;background:var(--acc);color:#fff;margin-top:40px;box-shadow:0 10px 28px color-mix(in srgb,var(--acc) 45%,transparent)}
.dark .chipbadge{background:var(--kl);color:#06101c}
/* terminal */
.term{width:960px;border-radius:32px;background:#0b1126;border:1.5px solid color-mix(in srgb,var(--t1) 50%,transparent);box-shadow:0 0 70px color-mix(in srgb,var(--t1) 30%,transparent),inset 0 0 50px color-mix(in srgb,var(--t1) 8%,transparent);overflow:hidden;position:relative;height:860px;color:#e6edff}
.tbar{height:72px;display:flex;align-items:center;padding:0 26px;gap:10px;border-bottom:1px solid rgba(255,255,255,.07);font-family:'DejaVu Sans Mono',monospace;font-size:20px;color:#8aa0d6}
.tbar b{width:18px;height:18px;border-radius:50%;display:block}
.tbar .tag{margin-left:auto;font-family:'PoppinsX';font-weight:700;font-size:16px;letter-spacing:.08em;color:#34d399;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);padding:8px 14px;border-radius:10px}
.tbody{padding:34px 36px;font-family:'DejaVu Sans Mono',monospace;font-size:30px}
.ln{min-height:160px;display:flex;flex-direction:column;justify-content:center;gap:10px;white-space:nowrap;border-bottom:1px dashed rgba(255,255,255,.06)}
.ln .cmd{display:flex;gap:14px;align-items:center}.ln .p{color:var(--t1)}
.ln .ok{color:#34d399;font-weight:700;font-size:28px;padding-left:44px}
.cur{display:inline-block;width:14px;height:30px;background:var(--t1);vertical-align:middle;margin-left:3px}
.win{position:absolute;left:36px;right:36px;bottom:34px;display:flex;flex-direction:column;gap:6px;padding:24px 30px;border-radius:22px;background:color-mix(in srgb,var(--t1) 10%,transparent);border:1.5px solid color-mix(in srgb,var(--t1) 40%,transparent);font-weight:700;font-size:30px;color:color-mix(in srgb,var(--t1) 40%,#fff)}
.win small{font-size:22px;color:var(--t1);font-weight:500}
/* alert */
.alert{position:relative;width:900px;height:900px;border-radius:40px;background:#0b1024;border:1.5px solid color-mix(in srgb,var(--al) 60%,transparent);box-shadow:0 0 90px color-mix(in srgb,var(--al) 45%,transparent),inset 0 0 50px color-mix(in srgb,var(--al) 9%,transparent);display:flex;flex-direction:column;align-items:center;padding:130px 56px 0;color:#fff}
.chip{position:absolute;top:-32px;left:50%;margin-left:-190px;width:380px;text-align:center;font-weight:700;font-size:23px;letter-spacing:.04em;padding:16px 0;border-radius:99px;background:var(--al);color:#fff;box-shadow:0 10px 28px color-mix(in srgb,var(--al) 55%,transparent)}
.lock{width:190px;height:190px;border-radius:50%;border:3px solid var(--al);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px color-mix(in srgb,var(--al) 50%,transparent);color:var(--al);padding:48px}
.big{font-weight:900;letter-spacing:-.02em;margin-top:56px;text-align:center;line-height:1.08}
.sub{font-size:34px;color:#94a3c4;margin-top:34px;font-style:italic;text-align:center;line-height:1.35}
.abar{position:absolute;left:54px;right:54px;bottom:54px;height:22px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.abar i{display:block;height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,#f59e0b,var(--al));border-radius:99px}
.alab{position:absolute;left:54px;bottom:100px;font-size:22px;font-weight:700;letter-spacing:.12em;color:color-mix(in srgb,var(--al) 55%,#fff)}
.gl{position:absolute;font-weight:900;color:color-mix(in srgb,var(--al) 22%,transparent);z-index:1;white-space:nowrap}
/* timeline */
.mini{width:600px;background:#fff;color:#0f172a;border-radius:30px;padding:24px 28px;box-shadow:0 20px 50px rgba(20,30,80,.25),0 0 0 1.5px color-mix(in srgb,var(--acc) 12%,transparent);position:absolute;display:flex;gap:22px;align-items:center;z-index:4}
.mini .n{width:42px;height:42px;border-radius:13px;background:var(--acc);color:#fff;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;position:absolute;top:-18px;left:-16px;transform:rotate(-8deg)}
.mini .ic{width:84px;height:84px;border-radius:24px;background:color-mix(in srgb,var(--acc) 12%,#fff);color:var(--acc);padding:20px;flex:none}
.mini h4{font-size:36px;font-weight:700;line-height:1.15}.mini p{font-size:25px;color:#64748b;margin-top:6px;font-weight:500;line-height:1.25}
.nt{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--acc);border:6px solid #fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 30%,transparent);z-index:5}
.dark .nt{border-color:var(--darkbg)}
.tag2{position:absolute;font-size:24px;font-weight:700;background:#fff;color:#475569;padding:14px 26px;border-radius:99px;box-shadow:0 8px 22px rgba(20,30,80,.2);z-index:4;white-space:nowrap}
/* monitor */
.lap{width:960px;height:800px;border-radius:30px;background:color-mix(in srgb,var(--vi) 8%,#0a0e2a);border:1.5px solid color-mix(in srgb,var(--vi) 55%,transparent);box-shadow:0 0 80px color-mix(in srgb,var(--vi) 38%,transparent);padding:36px 40px;font-family:'DejaVu Sans Mono',monospace;position:relative;overflow:hidden;color:#dbe4ff}
.lap .h{font-family:'PoppinsX';font-weight:700;font-size:25px;letter-spacing:.14em;color:var(--vi);margin-bottom:30px}
.tl{height:110px;display:flex;align-items:center;font-size:31px;position:relative}
.tl .red{position:absolute;left:0;top:20px;height:70px;border-radius:12px;background:color-mix(in srgb,var(--vi) 30%,#1b1f4b);transform-origin:left}
.tl span{position:relative;white-space:nowrap}
.scan{position:absolute;left:0;right:0;height:100px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--vi) 32%,transparent),transparent)}
.fc{position:absolute;display:flex;align-items:center;gap:22px;padding:24px 30px;border-radius:28px;background:#0e1330;border:1.5px solid var(--bc);box-shadow:0 0 40px var(--bg2);z-index:4;width:700px;color:#fff}
.fc .ic2{width:78px;height:78px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:var(--ic);color:#fff;padding:19px;flex:none}
.fc b{display:block;font-size:36px;font-weight:700;line-height:1.15}.fc small{display:block;font-size:25px;color:var(--tc);margin-top:6px;font-weight:500;line-height:1.25}
.t-violet{--tone:var(--vi)}.t-blue{--tone:var(--acc2)}.t-red{--tone:var(--al)}
.fc{--bc:color-mix(in srgb,var(--tone) 60%,transparent);--bg2:color-mix(in srgb,var(--tone) 30%,transparent);--ic:color-mix(in srgb,var(--tone) 80%,#000);--tc:color-mix(in srgb,var(--tone) 60%,#fff)}
/* cta */
.cta{position:relative;width:920px;height:700px;border-radius:40px;background:linear-gradient(135deg,var(--cta1),var(--cta2));box-shadow:0 40px 90px color-mix(in srgb,var(--cta2) 45%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 50px;color:#fff}
.cta .l{font-size:27px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.1em;text-align:center}
.plate{background:var(--plate);border-radius:24px;padding:28px 50px;font-weight:900;letter-spacing:.03em;color:#0f172a;box-shadow:0 12px 0 color-mix(in srgb,var(--plate) 72%,#000),0 20px 40px rgba(0,0,0,.2);text-align:center;line-height:1.1}
.cta .f{font-size:26px;color:rgba(255,255,255,.88);font-weight:500;text-align:center;line-height:1.4}
.fl2{position:absolute;display:flex;align-items:center;gap:14px;padding:18px 30px;border-radius:99px;background:#fff;font-size:28px;font-weight:700;color:#334155;box-shadow:0 14px 34px rgba(20,30,80,.22);z-index:4;white-space:nowrap}
.fl2 .ic3{width:36px;height:36px;color:var(--acc)}
.dk{display:flex;align-items:center;gap:14px;padding:20px 38px;border-radius:99px;background:#0f172a;color:#fff;font-weight:700;font-size:30px;box-shadow:0 14px 34px rgba(15,23,42,.38);border:1.5px solid rgba(255,255,255,.14)}
.dk .ic4{width:36px;height:36px;color:var(--plate)}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--acc) 16%,transparent)}
.pulse{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:5px solid color-mix(in srgb,var(--acc) 60%,transparent);z-index:6;pointer-events:none}
.dark .pulse{border-color:color-mix(in srgb,var(--k) 60%,transparent)}
/* big number */
.bnwrap{position:relative;width:780px;height:780px;display:flex;align-items:center;justify-content:center}
.bnwrap svg{position:absolute;inset:0}
.bnnum{display:inline-block;font-weight:900;letter-spacing:-.04em;line-height:1;position:relative;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent;white-space:nowrap}
.dark .bnnum{background:linear-gradient(135deg,#fff,var(--kl));-webkit-background-clip:text}
.bncap{font-size:54px;font-weight:900;text-align:center;line-height:1.12;max-width:880px;margin-top:10px}
.bnsub{font-size:32px;font-weight:500;text-align:center;line-height:1.3;max-width:820px;margin-top:18px;color:var(--sub)}
.bnchips{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap;justify-content:center}
.bnchip{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:700;padding:14px 24px;border-radius:99px}
.light .bnchip{background:#fff;box-shadow:0 8px 22px rgba(20,30,80,.14);color:#334155}
.dark .bnchip{background:color-mix(in srgb,var(--k) 12%,transparent);border:1.5px solid color-mix(in srgb,var(--k) 40%,transparent);color:#fff}
.bnchip .ic5{width:32px;height:32px;color:var(--acc)}.dark .bnchip .ic5{color:var(--kl)}
/* versus */
.vs{width:920px;height:410px;padding:34px 40px;position:relative}
.vs .hd{display:flex;align-items:center;gap:22px}
.vs .tile{width:84px;height:84px;border-radius:24px;padding:20px;color:#fff;flex:none}
.vs h3{font-size:50px;font-weight:900;line-height:1.1}
.vs ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:16px}
.vs li{display:flex;align-items:center;gap:16px;font-size:33px;font-weight:500;line-height:1.2}
.vs li .ck{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:22px}
.vsbadge{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;background:#0f172a;color:#fff;border:6px solid var(--lightbg);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:44px;z-index:8;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.dark .vsbadge{border-color:var(--darkbg);background:#fff;color:#0f172a}
.verdict{display:flex;align-items:center;gap:14px;padding:20px 38px;border-radius:99px;font-weight:700;font-size:32px;background:var(--acc);color:#fff;box-shadow:0 14px 34px color-mix(in srgb,var(--acc) 45%,transparent)}
.dark .verdict{background:var(--kl);color:#06101c}
/* leaderboard */
.lb{width:940px;padding:44px 44px 30px}
.lb .tt{font-size:28px;font-weight:700;letter-spacing:.12em;opacity:.7;margin-bottom:26px}
.lbr{display:flex;align-items:center;gap:22px;height:152px}
.lbr .rk{width:62px;height:62px;border-radius:18px;font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);flex:none}
.dark .lbr .rk{color:var(--kl);background:color-mix(in srgb,var(--k) 16%,transparent)}
.lbr .mn{flex:1}.lbr .nm{display:flex;justify-content:space-between;font-size:36px;font-weight:700;margin-bottom:14px;gap:16px}
.lbr .nm .vl{color:var(--acc);font-weight:900}.dark .lbr .nm .vl{color:var(--kl)}
.lbr .tr{height:30px;border-radius:99px;background:color-mix(in srgb,currentColor 12%,transparent);overflow:hidden}
.lbr .tr i{display:block;height:100%;transform-origin:left;border-radius:99px;background:color-mix(in srgb,currentColor 38%,transparent)}
.lbr.top .tr i{background:linear-gradient(90deg,var(--acc),var(--acc2))}.dark .lbr.top .tr i{background:linear-gradient(90deg,var(--k),#fff)}
.lbfoot{font-size:22px;opacity:.6;margin-top:6px;text-align:center}
/* chat */
.chat{width:940px;height:900px;overflow:hidden;display:flex;flex-direction:column}
.chat .ch{display:flex;align-items:center;gap:20px;padding:28px 36px;border-bottom:1.5px solid color-mix(in srgb,currentColor 10%,transparent)}

window.build=function(M){
  applyTheme(M.theme);TRANS=M.transition||'fade';
  document.getElementById('brandname').textContent=(M.brand&&M.brand.name||'AI QUANTUM').toUpperCase();
  document.getElementById('brandico').innerHTML='<img src="../assets/aq_logo.png" alt="">';
  PLOGO=M.product_logo||'';RSHOT=M.repo_shot||'';RINFO=M.repo_info||null;{const pl=document.getElementById('plogo');if(PLOGO){document.getElementById('plimg').src=PLOGO;pl.style.display='block';}}
  document.getElementById('src').textContent=M.source?('SOURCE · '+M.source.toUpperCase()):'';
  CAPS=M.captions||[];
  M.scenes.forEach((s,i)=>{
    const b=BUILDERS[s.type];if(!b)return;
    s.idx=i+1;s.n=M.scenes.length;
    const sec=b(s,s.start,s.end-s.start);
    sec.dataset.s=s.start;sec.dataset.e=s.end;
    stage.insertBefore(sec,document.getElementById('brand'));
    sec._beat=[...sec.querySelectorAll('.c,.mini,.fc,.fl2,.dk,.hl,.tag2')];
    scenes.push(sec);
  });
  for(let i=0;i<6;i++)stage.appendChild(H(`<div class="dot" id="d${i}"></div>`));
  window.seek(0);
};
window.seek=function(t){
  window.__t=t;
  stage.style.setProperty('--bgp',`${(t*16).toFixed(1)}px ${(t*11).toFixed(1)}px`);
  let beat=0;{let ls=-9;for(const c of CAPS){if(c[0]<=t)ls=c[0];else break;}const dt=t-ls;beat=ls<0?0:(dt<.08?dt/.08:Math.exp(-(dt-.08)*6));}
  anims.forEach(a=>applyAnim(a,t));
  let anyDark=false;
  scenes.forEach(sc=>{
    const s=+sc.dataset.s,e=+sc.dataset.e,first=(s===0);
    const inP=first?1:clamp((t-s)/.4),outP=clamp((t-e)/.3),vis=t>=s-.001&&t<e+.3;
    let o=0,tf='',cp='none';
    if(vis){
      const ei=E_OUT(inP),eo=E_INOUT(outP);
      if(TRANS==='slide'){o=(first?1:clamp(inP*2.2))*(1-outP);tf=`translateY(${(1-ei)*90-eo*60}px)`;}
      else if(TRANS==='zoom'){o=(first?1:clamp(inP*2))*(1-outP);tf=`scale(${1+.12*(1-ei)-.07*eo})`;}
      else if(TRANS==='wipe'){o=1-outP;cp=first?'none':`circle(${ei*1500}px at 50% 55%)`;}
      else{o=Math.min(first?1:clamp((t-s)/.28),1-outP);}
    }
    sc.style.opacity=clamp(o);sc.style.display=o>0?'block':'none';sc.style.transform=tf;sc.style.clipPath=cp;
    if(DARK.has(sc)&&o>.5)anyDark=true;
    const lt=t-s;
    sc.querySelectorAll('.fl').forEach((f,i)=>{f.style.transform=`translateY(${Math.sin(lt*1.7+i)*10}px) rotate(${Math.sin(lt*.9+i)*.25}deg)`;});
    if(o>0){const lp=clamp(lt/(e-s));const sk=(1+.045*lp)*(1+.035*beat);sc._beat.forEach(el=>{el.style.scale=sk;});}
  });
  stage.classList.toggle('ondark',anyDark);
  updaters.forEach(u=>u(t));
  typers.forEach(ty=>{
    const lt=t-ty.t0,n=Math.max(0,Math.min(ty.full.length,Math.floor(lt*ty.cps)));
    ty.el.innerHTML=lt<0?'':(esc(ty.full.slice(0,n))+((n<ty.full.length||Math.floor(t*2)%2===0)?'<span class="cur"></span>':''));
  });
  for(let i=0;i<6;i++){const d=document.getElementById('d'+i);if(!d)continue;
    d.style.display=anyDark?'block':'none';
    d.style.left=(100+i*170+Math.sin(t*.7+i*2)*40)+'px';d.style.top=(300+((i*271)%1300)+Math.cos(t*.5+i)*36)+'px';
    const z=5+(i%3)*2;d.style.width=z+'px';d.style.height=z+'px';d.style.opacity=.35+.3*Math.sin(t*2+i);}
  let txt='',op=0;
  for(const [a,b,x] of CAPS){if(t>=a&&t<b){txt=x;op=Math.min(1,(t-a)/.18,(b-t)/.18);break;}}
  const cap=document.getElementById('cap');if(txt&&cap.textContent!==txt)cap.textContent=txt;
  const w=document.getElementById('capw');w.style.opacity=op;w.style.transform=`translateY(${(1-op)*14}px)`;
  void stage.offsetHeight;
};
