<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:'PoppinsX';src:url('../fonts/Poppins-Regular.ttf');font-weight:400}
@font-face{font-family:'PoppinsX';src:url('../fonts/Poppins-Medium.ttf');font-weight:500}
@font-face{font-family:'PoppinsX';src:url('../fonts/Poppins-Bold.ttf');font-weight:700 900}
:root{--hi:#2f55e0;--acc:#2f55e0;--acc2:#22d3ee;--lightbg:#f3f6fc;--darkbg:#060a1a;--t1:#22d3ee;--al:#ff4d5e;--vi:#a78bfa;--cta1:#0fb894;--cta2:#0a8f8f;--plate:#fbbf24;--ink:#0f172a;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:'PoppinsX','Poppins','Noto Sans',sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.scene{position:absolute;inset:0;opacity:0}
.light{background:var(--lightbg);color:var(--ink);--sub:#64748b}
.dark{background:var(--darkbg);color:#fff;--sub:#94a3c4;--kl:color-mix(in srgb,var(--k) 55%,#fff)}
.scene::before,.scene::after{content:"";position:absolute;inset:0;pointer-events:none}
.scene::before{background-position:var(--bgp,0 0)}
.light::after{background:radial-gradient(ellipse 70% 40% at 50% 52%,color-mix(in srgb,var(--acc) 17%,transparent),transparent 70%)}
.dark::after{background:radial-gradient(ellipse 75% 38% at 50% 52%,color-mix(in srgb,var(--k) 26%,transparent),transparent 70%)}
/* background styles */
.bg-grid .light::before{background-image:linear-gradient(color-mix(in srgb,var(--acc) 8%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--acc) 8%,transparent) 1px,transparent 1px);background-size:54px 54px}
.bg-grid .dark::before{background-image:linear-gradient(color-mix(in srgb,var(--k) 9%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--k) 9%,transparent) 1px,transparent 1px);background-size:54px 54px}
.bg-dots .light::before{background-image:radial-gradient(color-mix(in srgb,var(--acc) 22%,transparent) 2.6px,transparent 3.2px);background-size:46px 46px}
.bg-dots .dark::before{background-image:radial-gradient(color-mix(in srgb,var(--k) 28%,transparent) 2.6px,transparent 3.2px);background-size:46px 46px}
.bg-diag .light::before{background-image:repeating-linear-gradient(135deg,transparent 0 34px,color-mix(in srgb,var(--acc) 7%,transparent) 34px 37px)}
.bg-diag .dark::before{background-image:repeating-linear-gradient(135deg,transparent 0 34px,color-mix(in srgb,var(--k) 9%,transparent) 34px 37px)}
.bg-stripes .light::before{background-image:repeating-linear-gradient(90deg,transparent 0 135px,color-mix(in srgb,var(--acc) 5%,transparent) 135px 270px)}
.bg-stripes .dark::before{background-image:repeating-linear-gradient(90deg,transparent 0 135px,color-mix(in srgb,var(--k) 7%,transparent) 135px 270px)}
.bg-plain .scene::before{display:none}
.row{position:absolute;left:0;right:0;display:flex;justify-content:center;z-index:3}
.row.left{justify-content:flex-start;padding-left:54px}
.c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;padding-top:120px;padding-bottom:260px}
.col{display:flex;flex-direction:column;align-items:center}
.abs{position:absolute;z-index:3}
.i{display:inline-flex;align-items:center;justify-content:center}
.i svg{width:100%;height:100%;display:block}
.kick{font-weight:700;font-size:25px;letter-spacing:.14em;padding:14px 28px;border-radius:99px;white-space:nowrap;display:flex;gap:14px;align-items:center}
.light .kick{background:#fff;color:color-mix(in srgb,var(--k) 62%,#0b1020);box-shadow:0 6px 24px color-mix(in srgb,var(--k) 18%,transparent)}
.dark .kick{background:color-mix(in srgb,var(--k) 10%,transparent);border:1.5px solid color-mix(in srgb,var(--k) 55%,transparent);color:var(--kl);box-shadow:0 0 30px color-mix(in srgb,var(--k) 28%,transparent)}
.kick.tag{border-radius:12px}.kick.tag b{opacity:.55;font-weight:700}
.panel{border-radius:40px}
.light .panel{background:#fff;box-shadow:0 30px 70px color-mix(in srgb,var(--acc) 22%,transparent),0 0 0 1.5px color-mix(in srgb,var(--acc) 10%,transparent)}
.dark .panel{background:color-mix(in srgb,var(--darkbg) 72%,#262e63);border:1.5px solid color-mix(in srgb,var(--k) 38%,transparent);box-shadow:0 0 70px color-mix(in srgb,var(--k) 26%,transparent)}
.ghost{position:absolute;left:0;right:0;top:760px;text-align:center;font-weight:900;z-index:1;line-height:1;white-space:nowrap}
.light .ghost{color:color-mix(in srgb,var(--acc) 8%,transparent)}.dark .ghost{color:rgba(255,255,255,.05)}
/* brand overlay */
#brand{position:absolute;left:54px;top:64px;z-index:30;display:flex;align-items:center;gap:14px;font-weight:700;font-size:28px;letter-spacing:.1em;color:#0f172a}
#brand .tile{width:68px;height:68px;border-radius:50%;overflow:hidden;background:#000;box-shadow:0 6px 18px rgba(0,0,0,.35)}#brand .tile img{width:100%;height:100%;display:block}
#plogo{position:absolute;right:54px;top:44px;z-index:30;width:84px;height:84px;border-radius:24px;background:#fff;padding:14px;box-shadow:0 8px 22px rgba(0,0,0,.28);display:none}#plogo img{width:100%;height:100%;object-fit:contain;display:block}
.plg{width:150px;height:150px;border-radius:36px;background:#fff;padding:26px;box-shadow:0 14px 34px rgba(0,0,0,.28)}.plg img{width:100%;height:100%;object-fit:contain;display:block}
.cmt{font-size:26px;font-weight:700;letter-spacing:.08em;padding:12px 26px;border-radius:99px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.55);color:#fff}
#src{position:absolute;right:54px;top:142px;z-index:30;font-size:20px;font-weight:500;letter-spacing:.08em;color:#64748b}
.ondark #brand{color:#fff}.ondark #src{color:#8b9bc7}
/* hook */
.hl{position:absolute;left:60px;right:60px;top:290px;text-align:center;font-weight:900;line-height:1.1;z-index:3;letter-spacing:-.01em}
.hl .w{display:inline-block;margin:0 .14em}.hl .w.hi{color:var(--hi)}.dark .hl .w.hi{color:var(--kl)}
.card1{position:relative;width:880px;padding:28px;border-radius:44px}
.screen{height:540px;border-radius:28px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 38%,#05071a),#070a1f 60%,color-mix(in srgb,var(--acc2) 26%,#0b0d2c));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden}
.screen .w2{font-weight:900;letter-spacing:.12em;margin-left:.12em;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 40%,#fff),#fff,var(--acc2));-webkit-background-clip:text;color:transparent;line-height:1.1;text-align:center;padding:0 24px}
.screen .by{font-size:22px;letter-spacing:.14em;color:#b4bde6;font-weight:500;text-align:center;padding:0 28px}
.screen .ico{width:84px;height:84px;color:#dbe4ff}
.shine{position:absolute;top:0;bottom:0;width:130px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);transform:skewX(-20deg)}
.bar{height:12px;border-radius:9px;background:color-mix(in srgb,var(--acc) 14%,#e8ecf8);overflow:hidden;margin-top:26px}
.bar i{display:block;height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px}
.pills{display:flex;gap:12px;margin-top:24px;justify-content:center;flex-wrap:wrap}
.pill{font-size:27px;font-weight:700;padding:12px 24px;border-radius:99px;background:color-mix(in srgb,var(--acc) 11%,#fff);color:var(--acc)}
.dark .pill{background:color-mix(in srgb,var(--k) 18%,transparent);color:var(--kl)}
.badge{position:absolute;top:-26px;left:-24px;z-index:5;font-size:22px;font-weight:700;letter-spacing:.08em;padding:12px 22px;border-radius:99px;color:#fff;background:#10b981;box-shadow:0 10px 26px rgba(16,185,129,.45)}
/* slam hook */
.slamw{display:inline-block;font-weight:900;line-height:.98;letter-spacing:-.03em;text-align:center;white-space:nowrap}
.slamw.hi{color:var(--hi)}.dark .slamw.hi{color:var(--kl)}
.slamsub{font-size:44px;font-weight:700;margin-top:34px;text-align:center;line-height:1.2;max-width:900px}
.chipbadge{display:inline-block;font-size:26px;font-weight:700;letter-spacing:.1em;padding:14px 28px;border-radius:99px;background:var(--acc);color:#fff;margin-top:40px;box-shadow:0 10px 28px color-mix(in srgb,var(--acc) 45%,transparent)}
.dark .chipbadge{background:var(--kl);color:#06101c}
/* terminal */
.term{width:960px;border-radius:32px;background:#0b1126;border:1.5px solid color-mix(in srgb,var(--t1) 50%,transparent);box-shadow:0 0 70px color-mix(in srgb,var(--t1) 30%,transparent),inset 0 0 50px color-mix(in srgb,var(--t1) 8%,transparent);overflow:hidden;position:relative;height:860px;color:#e6edff}
.tbar{height:72px;display:flex;align-items:center;padding:0 26px;gap:10px;border-bottom:1px solid rgba(255,255,255,.07);font-family:'DejaVu Sans Mono',monospace;font-size:20px;color:#8aa0d6}
.tbar b{width:18px;height:18px;border-radius:50%;display:block}
.tbar .tag{margin-left:auto;font-family:'PoppinsX';font-weight:700;font-size:16px;letter-spacing:.08em;color:#34d399;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);padding:8px 14px;border-radius:10px}
.tbody{padding:34px 36px;font-family:'DejaVu Sans Mono',monospace;font-size:30px}
.ln{min-height:160px;display:flex;flex-direction:column;justify-content:center;gap:10px;white-space:nowrap;border-bottom:1px dashed rgba(255,255,255,.06)}
.ln .cmd{display:flex;gap:14px;align-items:center}.ln .p{color:var(--t1)}
.ln .ok{color:#34d399;font-weight:700;font-size:28px;padding-left:44px}
.cur{display:inline-block;width:14px;height:30px;background:var(--t1);vertical-align:middle;margin-left:3px}
.win{position:absolute;left:36px;right:36px;bottom:34px;display:flex;flex-direction:column;gap:6px;padding:24px 30px;border-radius:22px;background:color-mix(in srgb,var(--t1) 10%,transparent);border:1.5px solid color-mix(in srgb,var(--t1) 40%,transparent);font-weight:700;font-size:30px;color:color-mix(in srgb,var(--t1) 40%,#fff)}
.win small{font-size:22px;color:var(--t1);font-weight:500}
/* alert */
.alert{position:relative;width:900px;height:900px;border-radius:40px;background:#0b1024;border:1.5px solid color-mix(in srgb,var(--al) 60%,transparent);box-shadow:0 0 90px color-mix(in srgb,var(--al) 45%,transparent),inset 0 0 50px color-mix(in srgb,var(--al) 9%,transparent);display:flex;flex-direction:column;align-items:center;padding:130px 56px 0;color:#fff}
.chip{position:absolute;top:-32px;left:50%;margin-left:-190px;width:380px;text-align:center;font-weight:700;font-size:23px;letter-spacing:.04em;padding:16px 0;border-radius:99px;background:var(--al);color:#fff;box-shadow:0 10px 28px color-mix(in srgb,var(--al) 55%,transparent)}
.lock{width:190px;height:190px;border-radius:50%;border:3px solid var(--al);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px color-mix(in srgb,var(--al) 50%,transparent);color:var(--al);padding:48px}
.big{font-weight:900;letter-spacing:-.02em;margin-top:56px;text-align:center;line-height:1.08}
.sub{font-size:34px;color:#94a3c4;margin-top:34px;font-style:italic;text-align:center;line-height:1.35}
.abar{position:absolute;left:54px;right:54px;bottom:54px;height:22px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.abar i{display:block;height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,#f59e0b,var(--al));border-radius:99px}
.alab{position:absolute;left:54px;bottom:100px;font-size:22px;font-weight:700;letter-spacing:.12em;color:color-mix(in srgb,var(--al) 55%,#fff)}
.gl{position:absolute;font-weight:900;color:color-mix(in srgb,var(--al) 22%,transparent);z-index:1;white-space:nowrap}
/* timeline */
.mini{width:600px;background:#fff;color:#0f172a;border-radius:30px;padding:24px 28px;box-shadow:0 20px 50px rgba(20,30,80,.25),0 0 0 1.5px color-mix(in srgb,var(--acc) 12%,transparent);position:absolute;display:flex;gap:22px;align-items:center;z-index:4}
.mini .n{width:42px;height:42px;border-radius:13px;background:var(--acc);color:#fff;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;position:absolute;top:-18px;left:-16px;transform:rotate(-8deg)}
.mini .ic{width:84px;height:84px;border-radius:24px;background:color-mix(in srgb,var(--acc) 12%,#fff);color:var(--acc);padding:20px;flex:none}
.mini h4{font-size:36px;font-weight:700;line-height:1.15}.mini p{font-size:25px;color:#64748b;margin-top:6px;font-weight:500;line-height:1.25}
.nt{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--acc);border:6px solid #fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 30%,transparent);z-index:5}
.dark .nt{border-color:var(--darkbg)}
.tag2{position:absolute;font-size:24px;font-weight:700;background:#fff;color:#475569;padding:14px 26px;border-radius:99px;box-shadow:0 8px 22px rgba(20,30,80,.2);z-index:4;white-space:nowrap}
/* monitor */
.lap{width:960px;height:800px;border-radius:30px;background:color-mix(in srgb,var(--vi) 8%,#0a0e2a);border:1.5px solid color-mix(in srgb,var(--vi) 55%,transparent);box-shadow:0 0 80px color-mix(in srgb,var(--vi) 38%,transparent);padding:36px 40px;font-family:'DejaVu Sans Mono',monospace;position:relative;overflow:hidden;color:#dbe4ff}
.lap .h{font-family:'PoppinsX';font-weight:700;font-size:25px;letter-spacing:.14em;color:var(--vi);margin-bottom:30px}
.tl{height:110px;display:flex;align-items:center;font-size:31px;position:relative}
.tl .red{position:absolute;left:0;top:20px;height:70px;border-radius:12px;background:color-mix(in srgb,var(--vi) 30%,#1b1f4b);transform-origin:left}
.tl span{position:relative;white-space:nowrap}
.scan{position:absolute;left:0;right:0;height:100px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--vi) 32%,transparent),transparent)}
.fc{position:absolute;display:flex;align-items:center;gap:22px;padding:24px 30px;border-radius:28px;background:#0e1330;border:1.5px solid var(--bc);box-shadow:0 0 40px var(--bg2);z-index:4;width:700px;color:#fff}
.fc .ic2{width:78px;height:78px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:var(--ic);color:#fff;padding:19px;flex:none}
.fc b{display:block;font-size:36px;font-weight:700;line-height:1.15}.fc small{display:block;font-size:25px;color:var(--tc);margin-top:6px;font-weight:500;line-height:1.25}
.t-violet{--tone:var(--vi)}.t-blue{--tone:var(--acc2)}.t-red{--tone:var(--al)}
.fc{--bc:color-mix(in srgb,var(--tone) 60%,transparent);--bg2:color-mix(in srgb,var(--tone) 30%,transparent);--ic:color-mix(in srgb,var(--tone) 80%,#000);--tc:color-mix(in srgb,var(--tone) 60%,#fff)}
/* cta */
.cta{position:relative;width:920px;height:700px;border-radius:40px;background:linear-gradient(135deg,var(--cta1),var(--cta2));box-shadow:0 40px 90px color-mix(in srgb,var(--cta2) 45%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 50px;color:#fff}
.cta .l{font-size:27px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.1em;text-align:center}
.plate{background:var(--plate);border-radius:24px;padding:28px 50px;font-weight:900;letter-spacing:.03em;color:#0f172a;box-shadow:0 12px 0 color-mix(in srgb,var(--plate) 72%,#000),0 20px 40px rgba(0,0,0,.2);text-align:center;line-height:1.1}
.cta .f{font-size:26px;color:rgba(255,255,255,.88);font-weight:500;text-align:center;line-height:1.4}
.fl2{position:absolute;display:flex;align-items:center;gap:14px;padding:18px 30px;border-radius:99px;background:#fff;font-size:28px;font-weight:700;color:#334155;box-shadow:0 14px 34px rgba(20,30,80,.22);z-index:4;white-space:nowrap}
.fl2 .ic3{width:36px;height:36px;color:var(--acc)}
.dk{display:flex;align-items:center;gap:14px;padding:20px 38px;border-radius:99px;background:#0f172a;color:#fff;font-weight:700;font-size:30px;box-shadow:0 14px 34px rgba(15,23,42,.38);border:1.5px solid rgba(255,255,255,.14)}
.dk .ic4{width:36px;height:36px;color:var(--plate)}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--acc) 16%,transparent)}
.pulse{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:5px solid color-mix(in srgb,var(--acc) 60%,transparent);z-index:6;pointer-events:none}
.dark .pulse{border-color:color-mix(in srgb,var(--k) 60%,transparent)}
/* big number */
.bnwrap{position:relative;width:780px;height:780px;display:flex;align-items:center;justify-content:center}
.bnwrap svg{position:absolute;inset:0}
.bnnum{display:inline-block;font-weight:900;letter-spacing:-.04em;line-height:1;position:relative;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent;white-space:nowrap}
.dark .bnnum{background:linear-gradient(135deg,#fff,var(--kl));-webkit-background-clip:text}
.bncap{font-size:54px;font-weight:900;text-align:center;line-height:1.12;max-width:880px;margin-top:10px}
.bnsub{font-size:32px;font-weight:500;text-align:center;line-height:1.3;max-width:820px;margin-top:18px;color:var(--sub)}
.bnchips{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap;justify-content:center}
.bnchip{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:700;padding:14px 24px;border-radius:99px}
.light .bnchip{background:#fff;box-shadow:0 8px 22px rgba(20,30,80,.14);color:#334155}
.dark .bnchip{background:color-mix(in srgb,var(--k) 12%,transparent);border:1.5px solid color-mix(in srgb,var(--k) 40%,transparent);color:#fff}
.bnchip .ic5{width:32px;height:32px;color:var(--acc)}.dark .bnchip .ic5{color:var(--kl)}
/* versus */
.vs{width:920px;height:410px;padding:34px 40px;position:relative}
.vs .hd{display:flex;align-items:center;gap:22px}
.vs .tile{width:84px;height:84px;border-radius:24px;padding:20px;color:#fff;flex:none}
.vs h3{font-size:50px;font-weight:900;line-height:1.1}
.vs ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:16px}
.vs li{display:flex;align-items:center;gap:16px;font-size:33px;font-weight:500;line-height:1.2}
.vs li .ck{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:22px}
.vsbadge{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;background:#0f172a;color:#fff;border:6px solid var(--lightbg);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:44px;z-index:8;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.dark .vsbadge{border-color:var(--darkbg);background:#fff;color:#0f172a}
.verdict{display:flex;align-items:center;gap:14px;padding:20px 38px;border-radius:99px;font-weight:700;font-size:32px;background:var(--acc);color:#fff;box-shadow:0 14px 34px color-mix(in srgb,var(--acc) 45%,transparent)}
.dark .verdict{background:var(--kl);color:#06101c}
/* leaderboard */
.lb{width:940px;padding:44px 44px 30px}
.lb .tt{font-size:28px;font-weight:700;letter-spacing:.12em;opacity:.7;margin-bottom:26px}
.lbr{display:flex;align-items:center;gap:22px;height:152px}
.lbr .rk{width:62px;height:62px;border-radius:18px;font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);flex:none}
.dark .lbr .rk{color:var(--kl);background:color-mix(in srgb,var(--k) 16%,transparent)}
.lbr .mn{flex:1}.lbr .nm{display:flex;justify-content:space-between;font-size:36px;font-weight:700;margin-bottom:14px;gap:16px}
.lbr .nm .vl{color:var(--acc);font-weight:900}.dark .lbr .nm .vl{color:var(--kl)}
.lbr .tr{height:30px;border-radius:99px;background:color-mix(in srgb,currentColor 12%,transparent);overflow:hidden}
.lbr .tr i{display:block;height:100%;transform-origin:left;border-radius:99px;background:color-mix(in srgb,currentColor 38%,transparent)}
.lbr.top .tr i{background:linear-gradient(90deg,var(--acc),var(--acc2))}.dark .lbr.top .tr i{background:linear-gradient(90deg,var(--k),#fff)}
.lbfoot{font-size:22px;opacity:.6;margin-top:6px;text-align:center}
/* chat */
.chat{width:940px;height:900px;overflow:hidden;display:flex;flex-direction:column}
.chat .ch{display:flex;align-items:center;gap:20px;padding:28px 36px;border-bottom:1.5px solid color-mix(in srgb,currentColor 10%,transparent)}
.chat .av{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;padding:18px;flex:none}
.chat .nmx{font-size:34px;font-weight:700;line-height:1.1}.chat .st{font-size:22px;color:#10b981;font-weight:500;margin-top:4px}
.chat .bd{padding:30px 34px;display:flex;flex-direction:column;gap:22px}
.bub{max-width:700px;padding:24px 32px;border-radius:34px;font-size:35px;line-height:1.28;font-weight:500;position:relative}
.bub.user{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:10px}
.dark .bub.user{background:var(--kl);color:#06101c}
.bub.ai,.bub.other{align-self:flex-start;border-bottom-left-radius:10px;background:color-mix(in srgb,currentColor 9%,transparent)}
.bub .who{display:block;font-size:21px;font-weight:700;letter-spacing:.06em;opacity:.65;margin-bottom:6px}
.bub .dots{position:absolute;left:32px;top:50%;margin-top:-10px;display:flex;gap:10px}
.bub .dots i{width:16px;height:16px;border-radius:50%;background:currentColor;opacity:.5;display:block}
/* quote */
.qc{width:930px;padding:70px 64px 56px;position:relative}
.qm{width:170px;height:170px;color:var(--acc);margin-bottom:10px}.dark .qm{color:var(--kl)}
.qt{font-size:62px;font-weight:900;line-height:1.16;letter-spacing:-.01em}
.qt mark{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--acc2) 55%,transparent) 58%);background-repeat:no-repeat;background-size:0% 100%;color:inherit;padding:0 4px}
.dark .qt mark{background-image:linear-gradient(transparent 58%,color-mix(in srgb,var(--k) 50%,transparent) 58%);background-repeat:no-repeat;background-size:0% 100%}
.qwho{display:flex;align-items:center;gap:20px;margin-top:44px}
.qwho .qa{width:80px;height:80px;border-radius:50%;background:var(--acc);color:#fff;padding:20px;flex:none}.dark .qwho .qa{background:var(--kl);color:#06101c}
.qwho b{display:block;font-size:34px;line-height:1.1}.qwho small{display:block;font-size:24px;opacity:.65;margin-top:4px}
/* checklist */
.cl{width:940px;padding:48px 48px 24px}
.cl .tt{font-size:42px;font-weight:900;margin-bottom:26px;line-height:1.15}
.clr{display:flex;align-items:center;gap:26px;min-height:130px;border-top:1.5px solid color-mix(in srgb,currentColor 10%,transparent)}
.clr .bx{width:72px;height:72px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.clr .bx svg{width:40px;height:40px}
.clr .tx{font-size:37px;font-weight:700;line-height:1.2}
.s-yes{background:#10b981}.s-no{background:#ef4444}.s-maybe{background:#f59e0b}
/* appclutter */
.actile{position:absolute;width:150px;height:150px}
.actile .in{width:100%;height:100%;border-radius:36px;box-shadow:0 14px 30px rgba(0,0,0,.28);position:relative}
.actile .in i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.88)}
.actile .in i.sq{border-radius:14px}
.actile .nb{position:absolute;right:-12px;top:-12px;min-width:44px;height:44px;border-radius:22px;background:#ef4444;color:#fff;font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;padding:0 8px;border:3px solid var(--lightbg)}
.dark .actile .nb{border-color:var(--darkbg)}
.ach{position:absolute;left:60px;right:60px;text-align:center;font-weight:900;line-height:1.12;letter-spacing:-.01em}
.ach u{text-decoration:none;color:var(--hi)}.dark .ach u{color:var(--kl)}
.acchat{position:absolute;left:90px;right:90px;display:flex;flex-direction:column;gap:26px}
.acchat .bub{font-size:40px;max-width:760px}
/* profile */
.pf{width:940px;display:flex;flex-direction:column;align-items:center;gap:30px}
.pfh{display:flex;align-items:center;gap:30px;width:100%}
.pfi{width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;padding:38px;flex:none;box-shadow:0 0 60px color-mix(in srgb,var(--acc) 45%,transparent)}
.pfn{font-weight:900;line-height:1.05;white-space:nowrap;display:inline-block}
.pft{font-size:30px;font-weight:500;color:var(--sub);margin-top:8px}
.pfp{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.pfp span{font-size:34px;font-weight:700;padding:16px 32px;border-radius:99px;background:var(--acc);color:#fff}
.dark .pfp span{background:color-mix(in srgb,var(--k) 22%,transparent);border:2px solid color-mix(in srgb,var(--k) 60%,transparent);color:#fff}
.pftl{font-size:42px;font-weight:700;text-align:center;line-height:1.2}
.pfc{width:100%;display:flex;align-items:center;gap:24px;padding:26px 32px;border-radius:32px}
.pfc .ic{width:88px;height:88px;border-radius:26px;background:var(--acc);color:#fff;padding:22px;flex:none}
.dark .pfc .ic{background:var(--kl);color:#06101c}
.pfc b{display:block;font-size:38px;font-weight:700;line-height:1.15}.pfc small{display:block;font-size:27px;color:var(--sub);font-weight:500;margin-top:5px}
.pfc .ok{margin-left:auto;width:56px;height:56px;border-radius:50%;background:#10b981;color:#fff;padding:13px;flex:none}
/* hubmap */
.hbh{position:absolute;width:190px;height:190px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;padding:50px;box-shadow:0 0 70px color-mix(in srgb,var(--acc) 50%,transparent)}
.hbn{position:absolute;width:150px;height:150px;border-radius:50%;padding:38px;border:4px solid var(--acc);color:var(--acc);background:#fff}
.dark .hbn{background:color-mix(in srgb,var(--darkbg) 70%,#262e63);border-color:var(--kl);color:var(--kl)}
.hbl{position:absolute;width:300px;text-align:center;font-size:32px;font-weight:700}
.hbc{position:absolute;left:70px;right:70px;padding:30px 36px}
.hbc .tt{font-size:36px;font-weight:900;margin-bottom:12px}
.hbr{display:flex;align-items:center;gap:22px;height:84px;font-size:34px;font-weight:500;border-top:1.5px solid color-mix(in srgb,currentColor 10%,transparent)}
.hbr .ri{width:46px;height:46px;color:var(--acc);flex:none}.dark .hbr .ri{color:var(--kl)}
/* roundup */
.ru{width:940px;display:flex;flex-direction:column;gap:26px;align-items:stretch}
.ruh{text-align:center;margin-bottom:6px}
.ruh h2{font-size:68px;font-weight:900;line-height:1.1}.ruh p{font-size:36px;font-weight:500;color:var(--sub);margin-top:10px}
.rud{display:flex;align-items:center;gap:28px;padding:28px 36px;border-radius:36px;position:relative}
.rud .ic{width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;padding:28px;flex:none}
.rud b{display:block;font-size:54px;font-weight:900;line-height:1.1}.rud small{display:block;font-size:29px;font-weight:500;color:var(--sub);margin-top:6px;line-height:1.25}
.rud .no{position:absolute;right:34px;top:18px;font-size:42px;font-weight:900;color:color-mix(in srgb,var(--acc) 35%,transparent)}
.dark .rud .no{color:color-mix(in srgb,var(--k) 55%,transparent)}
/* reveal */
.rvl{display:flex;flex-direction:column;align-items:center;gap:34px;width:940px}
.rvl .lg{width:340px;height:340px;border-radius:84px;background:#fff;padding:62px;box-shadow:0 30px 80px color-mix(in srgb,var(--acc) 40%,transparent),0 0 0 8px color-mix(in srgb,var(--acc2) 30%,transparent)}
.rvl .lg img,.rvl .lg svg{width:100%;height:100%;object-fit:contain;display:block;color:var(--acc)}
.rvl .meet{font-size:34px;font-weight:700;letter-spacing:.22em;color:var(--sub)}
.rvl .nm{font-weight:900;letter-spacing:-.02em;line-height:1.05;white-space:nowrap;display:inline-block;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
.dark .rvl .nm{background:linear-gradient(135deg,#fff,var(--kl));-webkit-background-clip:text}
.rvl .tg{font-size:44px;font-weight:700;text-align:center;line-height:1.22;max-width:900px}
.rvl .bd{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.rvl .bd span{font-size:28px;font-weight:700;letter-spacing:.06em;padding:14px 28px;border-radius:99px;background:var(--acc);color:#fff}
.dark .rvl .bd span{background:color-mix(in srgb,var(--k) 22%,transparent);border:2px solid color-mix(in srgb,var(--k) 60%,transparent)}
/* screenshot */
.shw{width:960px;height:1040px;border-radius:30px;overflow:hidden;position:relative;background:#0d1117;box-shadow:0 30px 80px rgba(0,0,0,.35),0 0 0 2px color-mix(in srgb,var(--acc) 30%,transparent)}
.shw .tb{height:76px;background:#161b22;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid #30363d}
.shw .tb b{width:16px;height:16px;border-radius:50%;display:block}
.shw .url{margin-left:14px;flex:1;height:44px;border-radius:22px;background:#0d1117;border:1px solid #30363d;color:#8b949e;font-size:23px;font-weight:500;display:flex;align-items:center;padding:0 22px;white-space:nowrap;overflow:hidden}
.shw .vp{position:absolute;left:0;right:0;top:76px;bottom:0;overflow:hidden}
.shw .vp img{position:absolute;left:0;top:0;width:100%;display:block}
.shw .fb{padding:60px 56px;color:#e6edf3}
.shw .fb h3{font-size:62px;font-weight:900;line-height:1.1}.shw .fb p{font-size:36px;color:#8b949e;margin-top:24px;line-height:1.35;font-weight:500}
.shw .fb .st{display:flex;gap:16px;margin-top:40px;flex-wrap:wrap}.shw .fb .st span{font-size:30px;font-weight:700;padding:12px 24px;border-radius:99px;background:#21262d;border:1px solid #30363d}
/* phases / cycle / stars */
.phc{position:absolute;left:90px;width:900px;display:flex;align-items:center;gap:26px;padding:26px 34px;border-radius:34px;background:#fff;color:#0f172a;box-shadow:0 20px 50px rgba(20,30,80,.22),0 0 0 2px color-mix(in srgb,var(--acc) 14%,transparent)}
.dark .phc{background:color-mix(in srgb,var(--k) 10%,#0b1226);color:#fff}
.phc .no{width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:42px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.phc h4{font-size:42px;font-weight:900;line-height:1.1}.phc p{font-size:27px;font-weight:500;color:#64748b;margin-top:6px;line-height:1.25}
.dark .phc p{color:var(--sub)}
.phc.on{box-shadow:0 20px 50px rgba(20,30,80,.22),0 0 0 5px var(--acc2)}
.cyn{position:absolute;width:250px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.cyn .ci{width:128px;height:128px;border-radius:40px;background:#fff;color:var(--acc);padding:32px;box-shadow:0 18px 44px rgba(20,30,80,.25),0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.dark .cyn .ci{background:color-mix(in srgb,var(--k) 14%,#0b1226);color:var(--kl)}
.cyn b{font-size:34px;font-weight:900;line-height:1.1}
.cyh{position:absolute;left:340px;top:790px;width:400px;text-align:center;font-size:46px;font-weight:900;line-height:1.1}
.stbig{font-size:230px;font-weight:900;letter-spacing:-.04em;line-height:1;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent;white-space:nowrap}
.stsub{font-size:40px;font-weight:800;text-align:center;line-height:1.2;max-width:860px}
.stbars{display:flex;align-items:flex-end;gap:22px;height:380px;margin-top:30px}
.stbars i{display:block;width:92px;border-radius:20px 20px 8px 8px;background:linear-gradient(180deg,var(--acc2),var(--acc));transform-origin:bottom}
/* ===== focus style: one visual per spoken idea, nothing else ===== */
.focus #brand,.focus #src,.focus #plogo,.focus .dot{display:none!important}
.focus .scene::before{display:none}
.fx{position:absolute;left:70px;right:70px;top:300px;bottom:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;z-index:2;text-align:center}
.fx .say{font-weight:900;line-height:1.08;letter-spacing:-.015em;max-width:940px}
.fx .say .w{display:inline-block;margin:0 .12em}
.fx .say .w.hi{color:var(--acc)}.dark .fx .say .w.hi{color:var(--acc2)}
.fx .say .w.hi{background:linear-gradient(transparent 70%,color-mix(in srgb,var(--acc2) 55%,transparent) 70% 94%,transparent 94%)}
.fx .big{font-weight:900;letter-spacing:-.04em;line-height:1;white-space:nowrap;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent;display:inline-block}
.dark .fx .big{background:linear-gradient(135deg,#fff,var(--acc2));-webkit-background-clip:text}
.fx .lab{font-weight:800;font-size:68px;line-height:1.1;max-width:900px}
.fx .bigic{width:360px;height:360px;color:var(--acc)}.dark .fx .bigic{color:var(--acc2)}
.fx .logo{width:300px;height:300px;border-radius:78px;background:#fff;padding:56px;box-shadow:0 30px 80px color-mix(in srgb,var(--acc) 40%,transparent)}.fx .logo img,.fx .logo svg{width:100%;height:100%;object-fit:contain;display:block;color:var(--acc)}
.fx .nm2{font-weight:900;letter-spacing:-.02em;line-height:1.05;white-space:nowrap;display:inline-block;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
.dark .fx .nm2{background:linear-gradient(135deg,#fff,var(--acc2));-webkit-background-clip:text}
.fx .code{font-family:ui-monospace,'DejaVu Sans Mono','Liberation Mono',monospace;font-weight:700;background:#0b1020;color:#e6edf3;border-radius:36px;padding:56px 54px;max-width:960px;text-align:left;word-break:break-all;line-height:1.35;box-shadow:0 30px 80px rgba(0,0,0,.4),0 0 0 3px color-mix(in srgb,var(--acc2) 55%,transparent)}
.fx .code .pr{color:var(--acc2)}.fx .code .cur{display:inline-block;width:.5em;height:1em;background:var(--acc2);vertical-align:-.12em;margin-left:4px}
/* repohook: opening glimpse of the repo's GitHub page */
.rhbg{position:absolute;inset:0;overflow:hidden;z-index:0}
.rhbg img{position:absolute;left:50%;top:0;width:160%;transform:translateX(-50%);filter:blur(34px) brightness(.34) saturate(1.3)}
.rhc{gap:26px;width:960px}
.rhl{font-size:50px;font-weight:800;letter-spacing:.2em;color:var(--kl);text-align:center;white-space:nowrap}
.rhh{font-weight:900;line-height:1.12;text-align:center;max-width:940px;background:linear-gradient(120deg,#fff 15%,var(--kl));-webkit-background-clip:text;color:transparent;padding-bottom:6px}
.shw.rhw{width:940px;height:790px}
.rhw .stc{font-size:26px;font-weight:800;color:#f0b429;background:#21262d;border:1px solid #30363d;border-radius:22px;padding:6px 18px;white-space:nowrap}
.shcap{margin-top:30px;font-size:34px;font-weight:700;text-align:center;max-width:900px;line-height:1.25}
#capw{position:absolute;left:0;right:0;bottom:330px;display:flex;justify-content:center;z-index:20;opacity:0}
#cap{max-width:980px;padding:20px 34px;border-radius:40px;background:rgba(10,14,30,.95);border:2px solid color-mix(in srgb,var(--acc2) 55%,transparent);color:#fff;font-size:44px;font-weight:800;line-height:1.38;text-align:center;box-shadow:8px 10px 0 color-mix(in srgb,var(--acc2) 70%,#000),0 14px 40px rgba(0,0,0,.28)}
#cap .w{display:inline-block;padding:0 12px;margin:0 2px;border-radius:16px;color:#fff}
#cap .w.on{background:var(--hl);color:var(--hlt)}
.beatring{position:absolute;left:50%;top:880px;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;border:5px solid var(--acc);z-index:19;pointer-events:none;opacity:0}
.ondark .beatring{border-color:rgba(255,255,255,.7)}
.dot{position:absolute;border-radius:50%;background:rgba(150,170,255,.55);z-index:1}
/* ===== motion library: spring-physics UI / type / shape / data scenes ===== */
.mo{--mi:#0b1020;--mv:#fff}.dark .mo{--mi:#fff;--mv:#0b1020}
.mo-stage{position:relative;width:940px;height:420px}
.mo-pill{position:absolute;left:50%;top:50%;height:170px;display:block;background:var(--mi);color:var(--mv);font-weight:800;overflow:hidden;will-change:auto}
.mo-pill>*{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;letter-spacing:-.02em}
.mo-pill .mo-ck,.mo-pill .mo-sp{width:96px;height:96px;color:#0b1020}.mo-pill .mo-sp{color:var(--mv)}
.mo-cur{position:absolute;left:50%;top:50%}
.mo-shape{width:760px;height:760px;display:block;overflow:visible}
.mo-chart{width:920px;height:520px;display:block;overflow:visible}
.mo-kl{position:absolute;inset:0;z-index:1}
.mo-kc{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding-bottom:160px}
.mo-kw{position:absolute;font-weight:900;letter-spacing:-.035em;line-height:1;white-space:nowrap;text-transform:uppercase}
.mo-kb{position:absolute;height:12px;border-radius:6px}
.mo-cmd{position:relative;width:900px}
.mo-panel{background:var(--mi);color:var(--mv);border-radius:48px;padding:34px 34px 26px;box-shadow:0 30px 80px rgba(0,0,0,.28)}
.mo-in{display:flex;align-items:center;gap:22px;height:104px;padding:0 10px 22px;border-bottom:3px solid color-mix(in srgb,var(--mv) 14%,transparent)}
.mo-k{font-weight:800;font-size:38px;padding:8px 20px;border-radius:18px;background:var(--k);color:#0b1020;flex:none}
.mo-q{font-weight:700;font-size:52px;white-space:nowrap;overflow:hidden;letter-spacing:-.02em}
.mo-q .cur{display:inline-block;width:.1em;height:.95em;background:var(--mv);vertical-align:-.12em;margin-left:6px}
.mo-row{display:flex;align-items:center;gap:20px;font-weight:700;font-size:44px;height:92px;padding:0 24px;border-radius:26px;margin-top:10px;overflow:hidden;white-space:nowrap}
.mo-row i{width:18px;height:18px;border-radius:50%;background:color-mix(in srgb,var(--mv) 35%,transparent);flex:none}
.mo-toast{position:absolute;left:50%;top:50%;display:flex;align-items:center;gap:22px;background:var(--mi);color:var(--mv);border-radius:999px;padding:30px 48px 30px 34px;font-weight:800;font-size:50px;white-space:nowrap;opacity:0}
.mo-toast svg{width:70px;height:70px;border-radius:50%;background:var(--k);padding:14px;flex:none}
.mo-tabs{position:relative;width:900px;height:132px;border-radius:66px;background:color-mix(in srgb,var(--mi) 12%,transparent)}
.mo-ind{position:absolute;top:13px;height:106px;border-radius:53px;background:var(--mi)}
.mo-tab{position:absolute;top:0;width:300px;height:132px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:46px;letter-spacing:-.02em}
.mo-ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mo-mk{position:relative;width:640px;height:640px;display:flex;align-items:center;justify-content:center}
.mo-wm{font-weight:900;white-space:nowrap;text-transform:uppercase}
#wipepanel{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--acc2);z-index:15;pointer-events:none}
/* ===== motion library 2: glass prompt + whip, stacked glass cards, orbit, wordmark ===== */
.mo-sky{position:absolute;inset:0;z-index:1;background:linear-gradient(170deg,color-mix(in srgb,var(--acc) 82%,#0b1020) 0%,color-mix(in srgb,var(--acc2) 60%,#fff) 100%);overflow:hidden}
.mo-sky svg{position:absolute;inset:0;width:100%;height:100%}
.mo-glass{position:relative;width:880px;height:280px;border-radius:64px;background:linear-gradient(160deg,rgba(255,255,255,.42),rgba(255,255,255,.16));backdrop-filter:blur(28px) saturate(1.4);-webkit-backdrop-filter:blur(28px) saturate(1.4);border:2px solid rgba(255,255,255,.5);border-top-color:rgba(255,255,255,.95);padding:46px 52px;transform-origin:50% 0;box-shadow:0 30px 70px rgba(8,20,60,.28)}
.mo-gt{font-size:56px;font-weight:600;color:#fff;line-height:1.2;text-align:left;letter-spacing:-.01em;text-shadow:0 1px 3px rgba(0,0,0,.14)}
.mo-gt .cur{display:inline-block;width:5px;height:1em;background:#fff;vertical-align:-.12em;margin-left:4px}
.mo-send{position:absolute;right:38px;bottom:34px;width:78px;height:78px;border-radius:50%;background:var(--k);padding:19px}
.mo-page{position:absolute;inset:0;z-index:4;background:#FDFDFB;display:none;overflow:hidden}
.mo-body{position:absolute;left:104px;right:104px;top:560px;font-size:60px;line-height:1.28;font-weight:500;color:#BCBCBA;text-align:left;letter-spacing:-.015em}
.mo-body b{color:#0b1020;font-weight:700}

<script>

  M.scenes.forEach((s,i)=>{

};

    if(o>0){const lp=clamp(lt/(e-s));const sk=(1+.045*lp)*(1+.035*beat);sc._beat.forEach(el=>{el.style.scale=sk;});}
  });
  stage.classList.toggle('ondark',anyDark);

   if(TRANS==='panel'){for(const sc of scenes){const s0=+sc.dataset.s;if(s0<=0)continue;const u=(t-(s0-.2))/.4;
     if(u>0&&u<1){if(u<.5){x0=0;x1=E_INOUT(u*2)*1080;}else{x0=E_INOUT((u-.5)*2)*1080;x1=1080;}}}}
   wp.style.left=x0+'px';wp.style.width=Math.max(0,x1-x0)+'px';}
