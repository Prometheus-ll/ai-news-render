<script>
/* ======================================================================
   Explainer engine - the explanation video layout (hook wall, meet card, module grid, learning path, example,
   numbered steps with a terminal, stats, call to action) drawn in the AI Quantum brand look:
   Poppins, the channel theme colours, dark/light scenes, glass panels with soft glows, the brand overlay and caption pill.
   Data driven: build(manifest) then seek(t). Every frame is a pure function of t. No bounce, no particles.
   Scene types: hook, meet, grid, path, example, step, stats, cta  (see MOTION_LIBRARY.md)
   ====================================================================== */
const W = 1080, H = 1920;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const THEMES = {
 indigo:{acc:'#2f55e0',acc2:'#22d3ee',lightbg:'#f3f6fc',darkbg:'#060a1a',t1:'#22d3ee',al:'#ff4d5e',vi:'#a78bfa',cta1:'#0fb894',plate:'#fbbf24',bg:'grid'},
 ember:{acc:'#e11d48',acc2:'#fb923c',lightbg:'#fff6f4',darkbg:'#14070b',t1:'#fb923c',al:'#fb7185',vi:'#f0abfc',cta1:'#e11d48',plate:'#fde047',bg:'dots'},
 forest:{acc:'#059669',acc2:'#84cc16',lightbg:'#f1fbf5',darkbg:'#04120c',t1:'#34d399',al:'#f87171',vi:'#5eead4',cta1:'#4f46e5',plate:'#fde047',bg:'diag'},
 ocean:{acc:'#0284c7',acc2:'#22d3ee',lightbg:'#eff8ff',darkbg:'#031525',t1:'#38bdf8',al:'#fb7185',vi:'#818cf8',cta1:'#0284c7',plate:'#fbbf24',bg:'stripes'},
 neon:{acc:'#7c3aed',acc2:'#ec4899',lightbg:'#faf5ff',darkbg:'#0b0620',t1:'#e879f9',al:'#fb7185',vi:'#c4b5fd',cta1:'#7c3aed',plate:'#a3e635',bg:'dots'},
 signal:{acc:'#111827',acc2:'#f59e0b',lightbg:'#fffbeb',darkbg:'#0a0a0a',t1:'#fbbf24',al:'#ef4444',vi:'#fcd34d',cta1:'#111827',plate:'#fbbf24',bg:'stripes'},
 mint:{acc:'#0d9488',acc2:'#6366f1',lightbg:'#effdfa',darkbg:'#031a18',t1:'#2dd4bf',al:'#fb7185',vi:'#a5b4fc',cta1:'#0d9488',plate:'#fde047',bg:'diag'},
 paper:{acc:'#1d4ed8',acc2:'#f43f5e',lightbg:'#fafaf9',darkbg:'#0c0a09',t1:'#60a5fa',al:'#f43f5e',vi:'#d6d3d1',cta1:'#1d4ed8',plate:'#fde047',bg:'plain'}
};
let T = THEMES.indigo, P = {}, AC = [];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgba = (h, a) => { const [r, gg, b] = hex(h); return `rgba(${r},${gg},${b},${a})`; };
const mixc = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const lum = h => { const [r, gg, b] = hex(h); return (.299 * r + .587 * gg + .114 * b) / 255; };
const onc = h => lum(h) > .55 ? '#0b1020' : '#ffffff';
function setScene(mode) {
  const dark = mode !== 'light', k = dark ? T.acc2 : T.acc;
  P = { dark, k, bg: dark ? T.darkbg : T.lightbg, tx: dark ? '#ffffff' : '#0f172a', sub: dark ? '#94a3c4' : '#64748b',
        panel: dark ? mixc(T.darkbg, '#262e63', .28) : '#ffffff', edge: dark ? rgba(k, .38) : rgba(T.acc, .10),
        glow: dark ? rgba(k, .26) : rgba(T.acc, .22), term: dark ? '#050813' : '#0b1020' };
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ramp = (t, t0, d) => clamp((t - t0) / d);
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const pop = (t, t0, d = .5) => eo(ramp(t, t0, d));                 // smooth settle, no overshoot
const lerp = (a, b, u) => a + (b - a) * u;
const SANS = '"PoppinsX", "Poppins", system-ui, sans-serif';
const MONO = '"DejaVu Sans Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
const font = (wt, size, mono) => `${wt} ${Math.round(size)}px ${mono ? MONO : SANS}`;
const mw = (s, wt, size, mono) => { g.font = font(wt, size, mono); return g.measureText(s).width; };
const fit = (s, wt, size, maxw, mono) => Math.min(size, size * maxw / Math.max(1, mw(s, wt, size, mono)));

function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
// glass / white panel: soft glow, hairline border. inner() draws in local coords (origin = centre)
function card(cx, cy, w, h, o = {}, inner) {
  const { fill = P.panel, r = 36, lw = 1.5, rot = 0, sc = 1, a = 1, stroke = P.edge, glow = P.glow, blur = 54, dy = 16 } = o;
  if (a <= .01 || sc <= .01) return;
  g.save(); g.globalAlpha *= a; g.translate(cx, cy); g.rotate(rot * Math.PI / 180); g.scale(sc, sc);
  g.shadowColor = glow; g.shadowBlur = blur; g.shadowOffsetY = P.dark ? 0 : dy;
  rr(-w / 2, -h / 2, w, h, r); g.fillStyle = fill; g.fill();
  g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
  if (lw) { g.lineWidth = lw; g.strokeStyle = stroke; g.stroke(); }
  if (inner) inner();
  g.restore();
}
function txt(s, x, y, o = {}) {
  const { size = 40, wt = 800, fill = P.tx, al = 'center', a = 1, mono = false, rot = 0, sc = 1 } = o;
  if (a <= .01 || !s || sc <= .01) return;
  g.save(); g.globalAlpha *= a; g.translate(x, y); g.rotate(rot * Math.PI / 180); g.scale(sc, sc);
  g.font = font(wt, size, mono); g.fillStyle = fill; g.textAlign = al; g.textBaseline = 'middle'; g.fillText(s, 0, 0); g.restore();
}
function line(x0, y0, x1, y1, w, col, a = 1) { if (a <= .01) return; g.save(); g.globalAlpha *= a; g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); g.restore(); }
function dot(x, y, r, fill, lw = 0, stroke = 'transparent') { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); if (lw) { g.lineWidth = lw; g.strokeStyle = stroke; g.stroke(); } }
// soft highlight band behind a headline
function marker(cx, cy, w, h, col, u = 1) { if (u <= .01) return; g.save(); g.translate(cx - w / 2, cy - h / 2); g.globalAlpha *= P.dark ? .55 : .5; rr(0, 0, w * u, h, h / 2); g.fillStyle = col; g.fill(); g.restore(); }
// pill chip
function sticker(t, t0, s, cx, cy, fill, rot = 0, size = 42, tf) {
  const p = pop(t, t0, .5); if (p <= .01) return; tf = tf || onc(fill);
  size = Math.min(size, size * 880 / (mw(s, 700, size) + 70));
  const w = mw(s, 700, size) + 70, h = size * 1.9;
  card(cx, cy, w, h, { fill, rot: rot * .6, sc: .9 + .1 * p, a: p, r: h / 2, lw: 0, glow: rgba(fill, .45), blur: 34, dy: 10 }, () => txt(s, 0, 2, { size, wt: 700, fill: tf }));
}
function stickerIcon(t, t0, s, kind, cx, cy, fill, rot = 0, size = 40, tf) {
  const p = pop(t, t0, .5); if (p <= .01) return; tf = tf || onc(fill);
  size = Math.min(size, size * 880 / (mw(s, 700, size) + 70 + size * 1.5));
  const w = mw(s, 700, size) + 70 + size * 1.5, h = size * 1.9;
  card(cx, cy, w, h, { fill, rot: rot * .6, sc: .9 + .1 * p, a: p, r: h / 2, lw: 0, glow: rgba(fill, .45), blur: 34, dy: 10 }, () => {
    ico(kind, -w / 2 + 38 + size * .45, 0, size * 1.1, { fill: tf, lw: 0, solid: true });
    txt(s, size * .7, 2, { size, wt: 700, fill: tf });
  });
}
// call-out badge (replaces the stamp): gradient pill that eases in
function stamp(t, t0, s, cx, cy, col, rot = -3, size = 50) {
  const p = pop(t, t0, .5); if (p <= .01) return;
  size = Math.min(size, size * 900 / (mw(s, 800, size) + 90));
  const w = mw(s, 800, size) + 90, h = size * 1.9;
  g.save(); g.translate(cx, cy); g.rotate(rot * Math.PI / 180); g.scale(.92 + .08 * p, .92 + .08 * p); g.globalAlpha *= p;
  g.shadowColor = rgba(T.acc2, .45); g.shadowBlur = 46; g.shadowOffsetY = P.dark ? 0 : 14;
  rr(-w / 2, -h / 2, w, h, h / 2); const gr = g.createLinearGradient(-w / 2, 0, w / 2, 0); gr.addColorStop(0, T.acc); gr.addColorStop(1, T.acc2); g.fillStyle = gr; g.fill();
  g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
  txt(s, 0, 3, { size, wt: 800, fill: '#fff', al: 'center' }); g.restore();
}
function headline(t, t0, s, y, size, o = {}) {
  const { fill = P.tx, mk = null, maxw = 940, a = 1 } = o;
  const sz = fit(s, 900, size, maxw), p = pop(t, t0, .6), w = mw(s, 900, sz);
  if (mk) marker(540, y + sz * .24, w + 44, sz * .5, mk, eo(ramp(t, t0 + .35, .55)));
  txt(s, 540, y + (1 - p) * 46, { size: sz, wt: 900, fill, a: clamp(p * 2) });
}
function starPts(cx, cy, R, r) { const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R; p.push([cx + rad * Math.cos(a), cy + rad * Math.sin(a)]); } return p; }

// flat icons drawn in a 100-unit box centred on (x, y)
function ico(kind, x, y, s, o = {}) {
  const { fill = T.acc2, lw = 4, a = 1, rot = 0, solid = false } = o; if (a <= .01 || s <= 1) return;
  g.save(); g.globalAlpha *= a; g.translate(x, y); g.rotate(rot * Math.PI / 180); g.scale(s / 100, s / 100);
  const ink = solid ? fill : 'rgba(11,16,32,.9)';
  g.lineWidth = Math.max(lw, solid ? 0 : 3) * 100 / s; g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = ink; g.fillStyle = fill;
  const dr = () => { if (!solid) g.stroke(); };
  const poly = (p, f = true) => { g.beginPath(); p.forEach(([a_, b_], i) => i ? g.lineTo(a_, b_) : g.moveTo(a_, b_)); g.closePath(); if (f) g.fill(); dr(); };
  const ln = p => { g.beginPath(); p.forEach(([a_, b_], i) => i ? g.lineTo(a_, b_) : g.moveTo(a_, b_)); g.stroke(); };
  const circ = (cx, cy, r, f = true) => { g.beginPath(); g.arc(cx, cy, r, 0, 7); if (f) g.fill(); dr(); };
  const rect = (x_, y_, w_, h_, r_) => { g.beginPath(); g.roundRect(x_, y_, w_, h_, r_); g.fill(); dr(); };
  switch (kind) {
    case 'bolt': poly([[12, -50], [-28, 6], [-4, 6], [-14, 50], [30, -8], [6, -8], [18, -50]]); break;
    case 'star': poly(starPts(0, 4, 50, 21)); break;
    case 'check': g.strokeStyle = solid ? fill : ink; g.lineWidth = (solid ? 9 : 8) * 100 / s * (s / 100); ln([[-30, 2], [-10, 24], [30, -22]]); break;
    case 'robot': g.strokeStyle = ink; ln([[0, -24], [0, -38]]); rect(-46, -6, 10, 24, 4); rect(36, -6, 10, 24, 4); rect(-36, -24, 72, 60, 16);
      g.fillStyle = '#ff4d5e'; circ(0, -43, 7); g.fillStyle = '#fff'; circ(-16, 5, 9); circ(16, 5, 9);
      g.fillStyle = '#0b1020'; circ(-16, 5, 3.5); circ(16, 5, 3.5); ln([[-14, 25], [14, 25]]); break;
    case 'bug': g.strokeStyle = ink; ln([[-18, -4], [-40, -12]]); ln([[18, -4], [40, -12]]); ln([[-18, 10], [-42, 12]]); ln([[18, 10], [42, 12]]);
      ln([[-16, 24], [-36, 38]]); ln([[16, 24], [36, 38]]); ln([[-6, -32], [-16, -46]]); ln([[6, -32], [16, -46]]);
      g.beginPath(); g.ellipse(0, 8, 21, 28, 0, 0, 7); g.fill(); dr(); circ(0, -24, 13); break;
    case 'folder': rect(-46, -42, 46, 26, 7); rect(-48, -28, 96, 72, 10); break;
    case 'mag': circ(-8, -8, 28); g.strokeStyle = ink; g.lineWidth = 8 * 100 / s * (s / 100); ln([[13, 13], [40, 40]]); break;
    case 'cursor': poly([[-18, -34], [-18, 26], [-4, 12], [8, 38], [18, 33], [7, 8], [26, 8]]); break;
    case 'doc': default: poly([[-30, -46], [14, -46], [32, -28], [32, 46], [-30, 46]]); g.strokeStyle = ink; ln([[14, -46], [14, -28], [32, -28]]);
      ln([[-18, -6], [20, -6]]); ln([[-18, 10], [20, 10]]); ln([[-18, 26], [6, 26]]);
  }
  g.restore();
}
const GLYPHS = ['doc', 'bolt', 'robot', 'bug', 'folder', 'mag', 'star'];
function arrow(x0, y0, x1, y1, w, col, u = 1) { if (u <= .01) return; const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy), a = Math.atan2(dy, dx), e = L * u;
  line(x0, y0, x0 + Math.cos(a) * (e - 14), y0 + Math.sin(a) * (e - 14), w, col);
  if (u > .85) { g.save(); g.translate(x0 + Math.cos(a) * e, y0 + Math.sin(a) * e); g.rotate(a); g.beginPath(); g.moveTo(0, 0); g.lineTo(-28, -17); g.lineTo(-28, 17); g.closePath(); g.fillStyle = col; g.fill(); g.restore(); } }
function stepHead(t, n, title, col, size = 92) {
  const p = pop(t, .05, .5); card(540, 270, 112, 112, { fill: col, r: 56, lw: 0, sc: .85 + .15 * p, a: p, glow: rgba(col, .5), blur: 40, dy: 10 }, () => txt(String(n), 0, 3, { size: 62, wt: 900, fill: onc(col) }));
  headline(t, .25, title, 410, size, { mk: T.acc2 });
}
// dark terminal. lines: [text, startTime, charsPerSec, colour]
function term(cx, cy, w, h, t, t0, lines, fs = 26, lh = 50) {
  const p = pop(t, t0, .55); if (p <= .01) return;
  card(cx, cy, w, h, { fill: P.term, sc: .94 + .06 * p, a: p, r: 30, stroke: rgba(P.k, .4), glow: rgba(P.k, .3) }, () => {
    [T.al, T.plate, T.cta1].forEach((c, i) => dot(-w / 2 + 44 + i * 34, -h / 2 + 38, 10, c));
    lines.forEach(([s, ts, cps, col], i) => { if (t < ts) return; const n = Math.min(s.length, Math.floor((t - ts) * cps)), y = -h / 2 + 104 + i * lh;
      const f2 = fit(s, 600, fs, w - 90, true);
      txt(s.slice(0, n), -w / 2 + 42, y, { size: f2, wt: 600, mono: true, al: 'left', fill: col || '#e2e8f0' });
      if (n < s.length) { const ww = mw(s.slice(0, n), 600, f2, true); g.fillStyle = T.acc2; g.fillRect(-w / 2 + 44 + ww, y - f2 * .6, f2 * .55, f2 * 1.2); } });
  });
}

/* ======================================================================
   SCENES - fn(t, d)   t = seconds into the scene (time-scaled), d = data
   ====================================================================== */
const up = s => String(s || '').toUpperCase();
const A = i => AC[i % AC.length];
function sHook(t, d) {
  headline(t, .15, d.lines[0], 330, 118);
  headline(t, .55, d.lines[1], 470, 118, { mk: T.acc2 });
  d.chips.slice(0, 8).forEach((nm, i) => { const x = i % 2 ? 790 : 290, y = 680 + Math.floor(i / 2) * 150, t0 = .9 + i * .22, p = pop(t, t0, .5); if (p <= .01) return;
    card(x, y + Math.sin(t * 2 + i) * 4, 440, 108, { sc: .9 + .1 * p, a: p, r: 54 }, () => { dot(-170, 0, 17, A(i)); txt(nm, 22, 2, { size: fit(nm, 700, 38, 300, true), wt: 700, mono: true }); }); });
  if (d.stamp) stamp(t, 3.2, d.stamp, 540, 1380, T.acc, -3, 48);
}
function sMeet(t, d) {
  txt(up(d.meet || 'MEET'), 540, 290, { size: 42, wt: 700, fill: P.sub, a: eo(ramp(t, .1, .4)) });
  const pl = pop(t, .2, .6);
  card(540, 480, 250, 250, { fill: '#ffffff', r: 56, sc: .85 + .15 * pl, a: pl, glow: rgba(T.acc2, .5), blur: 70 }, () => {
    if (LOGO && LOGO.complete && LOGO.naturalWidth) { const k = Math.min(170 / LOGO.naturalWidth, 170 / LOGO.naturalHeight); g.drawImage(LOGO, -LOGO.naturalWidth * k / 2, -LOGO.naturalHeight * k / 2, LOGO.naturalWidth * k, LOGO.naturalHeight * k); }
    else ico(GLYPHS.includes(d.glyph) ? d.glyph : 'doc', 0, 0, 150, { fill: T.acc, lw: 0, solid: true });
  });
  const np = pop(t, .6, .6), nm = d.name, sz = fit(nm, 900, 130, 800);
  card(540, 800, 930, 250, { sc: .94 + .06 * np, a: np, r: 44 }, () => { txt(d.owner || '', 0, -70, { size: fit(d.owner || 'x', 600, 42, 840, true), wt: 600, mono: true, fill: P.sub }); txt(nm, 0, 26, { size: sz, wt: 900 }); });
  const st = d.stickers || [];
  if (st[0]) sticker(t, 1.5, st[0], 300, 1010, T.acc, -3, 42);
  if (st[1]) sticker(t, 2.3, st[1], 750, 1050, T.vi, 3, 42);
  if (st[2]) sticker(t, 4.0, st[2], 540, 1180, T.cta1, -2, 42);
  if (d.stamp) stamp(t, 6.0, d.stamp, 540, 1370, T.acc, -3, 48);
}
function sGrid(t, d) {
  headline(t, .1, d.title, 330, 118, { mk: T.acc2 });
  const items = d.items.slice(0, 10), rows = Math.ceil(items.length / 2), gap = Math.min(160, Math.floor(780 / rows));
  items.forEach((it, i) => { const x = i % 2 ? 790 : 290, y = 530 + Math.floor(i / 2) * gap, p = pop(t, .4 + i * .28, .5); if (p <= .01) return; const ch = Math.min(130, gap - 24), col = A(i);
    card(x, y, 470, ch, { sc: .92 + .08 * p, a: p, r: 34 }, () => {
      card(-168, 0, 78, 78, { fill: col, r: 22, lw: 0, glow: rgba(col, .4), blur: 24, dy: 6 }, () => txt(String(it.n || i + 1).padStart(2, '0'), 0, 3, { size: 32, wt: 800, mono: true, fill: onc(col) }));
      txt(it.label, -112, 2, { size: fit(it.label, 700, 30, 270, true), wt: 700, mono: true, al: 'left' }); }); });
  if (d.sticker) sticker(t, 3.4, d.sticker, 540, 1430, T.acc, -2, 40);
}
function sPath(t, d) {
  headline(t, .1, d.title, 330, 108, { mk: T.acc2 });
  const steps = d.steps.slice(0, 5), n = steps.length;
  const ry = i => 560 + i * 150, ru = eo(ramp(t, .3, 2.2));
  line(170, ry(0), 170, lerp(ry(0), ry(n - 1), ru), 8, rgba(P.k, .5));
  steps.forEach((s, i) => { const t0 = .4 + i * .45, p = pop(t, t0, .5); if (p <= .01) return; const hot = i < 2 && t > 2.8, col = A(i);
    dot(170, ry(i), 44 * (.8 + .2 * p), col); g.save(); g.shadowColor = rgba(col, .5); g.shadowBlur = 30; dot(170, ry(i), 44 * (.8 + .2 * p), col); g.restore();
    txt(String(i + 1), 170, ry(i) + 3, { size: 38, wt: 800, fill: onc(col), a: p });
    card(640, ry(i), 760, 118, { fill: hot ? T.acc : P.panel, sc: .94 + .06 * p, a: p, r: 34, glow: hot ? rgba(T.acc, .45) : P.glow }, () => { txt(s.name, -340, 2, { size: fit(s.name, 700, 42, 520), wt: 700, al: 'left', fill: hot ? onc(T.acc) : P.tx });
      if (s.tag) txt(s.tag, 340, 4, { size: 30, wt: 700, mono: true, al: 'right', fill: hot ? onc(T.acc) : P.sub }); }); });
  if (d.stamp) stamp(t, 3.0, d.stamp, 540, 1390, T.acc, -3, 46);
}
function sExample(t, d) {
  headline(t, .1, d.title, 320, 104, { mk: T.acc2 });
  const p0 = pop(t, .2, .55);
  card(540, 690, 900, 400, { sc: .94 + .06 * p0, a: p0, r: 40 }, () => {
    ico('doc', -380, -140, 64, { fill: T.acc2, lw: 0, solid: true }); txt(d.file, -330, -140, { size: fit(d.file, 700, 42, 640, true), wt: 700, mono: true, al: 'left' });
    d.lines.slice(0, 4).forEach((s, i) => { const q = eo(ramp(t, .7 + i * .35, .3));
      txt(s, -390, -50 + i * 66, { size: fit(s, i ? 500 : 700, 34, 780, true), wt: i ? 500 : 700, mono: true, al: 'left', a: q, fill: i ? P.sub : T.acc2 }); }); });
