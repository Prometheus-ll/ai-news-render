name: Post next video

# The daily pipeline (01:00 UTC = 7 AM Bangladesh) renders all videos and queues them (state/post_queue.json).
# This workflow publishes ONE queued video per run, to every connected platform (Facebook, Instagram, YouTube), timed for a Bangladesh audience (UTC+6):
#   03:00 UTC =  9 AM Dhaka  (morning scroll)
#   08:00 UTC =  2 PM Dhaka  (after lunch)
#   15:00 UTC =  9 PM Dhaka  (evening peak)
# Change the cron lines below to move the slots. GitHub can start scheduled runs a few minutes late.
on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 8 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-quantum-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Post the next queued video
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python pipeline/post_queue.py
