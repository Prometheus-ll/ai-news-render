name: Post next video

# The daily pipeline (07:00 UTC) renders all videos and queues them (state/post_queue.json).
# This workflow publishes ONE queued video per run, at three times a day:
#   13:00 UTC = 9 AM New York  (morning)
#   17:00 UTC = 1 PM New York  (afternoon)
#   22:00 UTC = 6 PM New York  (evening)
# Change the cron lines below to move the slots. GitHub can start scheduled runs a few minutes late.
on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-quantum-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Post the next queued video
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python pipeline/post_queue.py
